services:
  - type: web
    name: nexora-leadflow
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-leadflow-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "true"
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MOCK_AI
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: HUBSPOT_ENABLED
        value: "true"
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: SLACK_ENABLED
        value: "true"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: RESEND_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: INTEGRATION_TIMEOUT_SECONDS
        value: "5"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: HIGH_VALUE_BUDGET_MONTHLY
        value: "25000"
      - key: CORS_ORIGINS
        value: http://localhost:8000

databases:
  - name: nexora-leadflow-db
    databaseName: leadflow
    user: leadflow
    plan: basic-256mb
    region: oregon
